<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>AI Chat</h1>
            <div class="model-info">
                <span id="model-name">{{ model }}</span>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
                <div class="message-content">
                    Hello! I'm your AI assistant. How can I help you today?
                </div>
            </div>
        </div>

        <div class="chat-input-container">
            <div class="input-wrapper">
                <textarea
                    id="messageInput"
                    placeholder="Type your message here..."
                    rows="1"
                    autocomplete="off"
                ></textarea>
                <button id="sendButton" onclick="sendMessage()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
            <div class="options">
                <label>
                    Temperature: <span id="tempValue">0.70</span>
                    <input type="range" id="temperature" min="0.0" max="1.20" step="0.01" value="0.70" oninput="updateTemp(this.value)">
                </label>
                <label>
                    <input type="checkbox" id="researchMode"> Research Mode
                </label>
                <label>
                    <input type="checkbox" id="compressionEnabled" checked> History Compression
                </label>
                <button onclick="clearChat()" class="clear-btn">Clear Chat</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
